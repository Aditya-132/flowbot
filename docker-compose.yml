# Local Postgres for FlowBot:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flowbot
      POSTGRES_PASSWORD: flowbot
      POSTGRES_DB: flowbot
    ports:
      - "5432:5432"
    volumes:
      - flowbot_pgdata:/var/lib/postgresql/data
volumes:
  flowbot_pgdata:
