<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO (the marketing pages live at /; this app shell is served at /app) -->
    <title>FlowBot Studio — Build a WhatsApp Bot Free | Drag & Drop Canvas</title>
    <meta name="description" content="The FlowBot builder: drag 40+ blocks onto a canvas, wire your WhatsApp bot's conversation, test it in a live simulator, launch on Meta Cloud API, Twilio, Green API or Whapi — or export the full code as a ZIP. Free, works without signup." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#25D366" />
    <meta name="application-name" content="FlowBot" />
    <link rel="canonical" href="https://flochatbot.com/app" />


    <!-- Icons + PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlowBot" />
    <meta property="og:title" content="FlowBot Studio — Build a WhatsApp Bot Free (Drag & Drop)" />
    <meta property="og:description" content="Design your WhatsApp bot as a flowchart, test it in a live simulator, launch on Meta / Twilio / Green API / Whapi — or download the complete bot code as a ZIP. 40+ blocks, ready templates, and a Block Lab to invent your own blocks." />
    <meta property="og:url" content="https://flochatbot.com/app" />
    <meta property="og:image" content="https://flochatbot.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlowBot Studio — Build a WhatsApp Bot Free (Drag & Drop)" />
    <meta name="twitter:description" content="Drag-and-drop WhatsApp chatbot builder with 40+ blocks, ready templates, live simulator, one-click provider hookup and full code export as ZIP." />
    <meta name="twitter:image" content="https://flochatbot.com/og-image.png" />

    <!-- Structured data: breadcrumb back to the marketing home, which carries
         the canonical SoftwareApplication/Organization markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "FlowBot", "item": "https://flochatbot.com/" },
        { "@type": "ListItem", "position": 2, "name": "FlowBot Studio (builder)", "item": "https://flochatbot.com/app" }
      ]
    }
    </script>

    <!-- Sora — the UI font the app styles ask for -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <style>
      html,body,#root{margin:0;height:100%;background:#eef2f9;}
      /* 16px inputs stop iOS Safari from zooming in on focus */
      @media (max-width: 860px){ input, textarea, select { font-size: 16px !important; } }

      /* ---- global micro-interactions (inline styles can't do hover/focus) ---- */
      button{ transition: transform .12s ease, box-shadow .12s ease, filter .12s ease, background .12s ease; }
      button:hover:not(:disabled){ filter: brightness(1.04); transform: translateY(-1px); }
      button:active:not(:disabled){ transform: translateY(0); filter: brightness(.97); }
      input, textarea, select{ transition: border-color .15s ease, box-shadow .15s ease; }
      input:focus, textarea:focus, select:focus{ border-color:#25D366 !important; box-shadow:0 0 0 3px rgba(37,211,102,.18); }
      ::selection{ background:#25D36633; }
      *{ scrollbar-width: thin; scrollbar-color: #c3cfe0 transparent; }
      *::-webkit-scrollbar{ width:8px; height:8px; }
      *::-webkit-scrollbar-thumb{ background:#c3cfe0; border-radius:99px; }
      *::-webkit-scrollbar-thumb:hover{ background:#a8b8ce; }
      *::-webkit-scrollbar-track{ background:transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 20px;">
        <h1>FlowBot Studio — WhatsApp Bot Builder</h1>
        <p>This is the FlowBot builder: design your WhatsApp bot as a flowchart with 40+ ready blocks
        (menus, FAQs, bookings, catalogs, payments, CSAT and more), create your own blocks in the
        Block Lab, start from templates for restaurants, banks, hotels and online stores, test
        everything in a live simulator, then go live via Meta WhatsApp Cloud API, Twilio, Green API
        or Whapi.cloud — or export your bot's complete Node.js code as a ZIP.</p>
        <p>The builder needs JavaScript enabled to run. Meanwhile, you can read about FlowBot on the
        <a href="/">home page</a>, browse <a href="/whatsapp-bot-templates">free templates</a> or the
        <a href="/how-to-make-a-whatsapp-bot">step-by-step guide</a>.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
